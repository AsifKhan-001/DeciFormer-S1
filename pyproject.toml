[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "system-one"
version = "1.0.0"
description = "System-1 Decision Engine: decoder transformer + decision head + calibration + policy"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "transformers>=4.44", "numpy>=1.26", "pyyaml>=6.0", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
