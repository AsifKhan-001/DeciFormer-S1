model: {backbone: scratch, max_seq_len: 64, hidden_size: 128, num_layers: 3, num_heads: 4, intermediate_size: 352, dropout: 0.1, num_classes: 5}
decision: {mode: fixed, pooling: decision_token}
calibration: {enabled: true, hidden_size: 64}
policy: {route_threshold: 0.85, clarify_threshold: 0.5, min_margin: 0.15}
data: {tokenizer: simple, labels_path: data/labels.json}
training: {epochs: 20, batch_size: 32, lr: 0.001, backbone_lr: 0.001, head_warmup_epochs: 0, unfreeze_fraction: 1.0, patience: 6, monitor: val_f1}
